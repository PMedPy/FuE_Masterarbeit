# ============================================================
# FuE_Masterarbeit -- Latente Diffusion fuer AMPs
# ============================================================
# Erstellen:     conda env create -f environment.yml
# Aktualisieren: conda env update -f environment.yml --prune
# Aktivieren:    conda activate fue-amp
#
# PyTorch kommt bewusst ueber pip: der offizielle PyTorch-
# Anaconda-Kanal wurde eingestellt (pytorch/pytorch#138506).
# ESM-2 kommt ueber fair-esm -- das ist die API, auf die sich der
# Referenzcode von Torres stuetzt. transformers bleibt installiert,
# aber nur fuer ProGen2 in der Evaluation (Abschnitt 9).
# ============================================================
name: fue-amp

channels:
  - conda-forge
  - bioconda
  # Kein "defaults" und kein "pytorch" -- Mischen bricht das Solving.

dependencies:
  # ---------- Interpreter ----------
  - python=3.11

  # ---------- Wissenschaftlicher Kern ----------
  - numpy>=1.26,<3
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - pyarrow      # Parquet-Engine fuer pandas (to_parquet/read_parquet)
  - pyyaml       # config.yaml im RunManager (yaml.safe_dump / safe_load)

  # ---------- PyTorch ----------
  # Ueber conda-forge, NICHT ueber pip: das pip-Wheel bringt ein eigenes
  # libomp mit, das mit dem llvm-openmp von numpy/scipy kollidiert
  # (OMP Error #15). Der eingestellte Kanal war "pytorch" -- conda-forge
  # liefert PyTorch weiterhin, inkl. MPS auf Apple Silicon.
  #
  # Auf einem Linux-Cluster mit CUDA kann das pip-Wheel die bessere
  # Wahl sein; dort tritt der libomp-Konflikt meist nicht auf.
  # Die Umgebung ist nicht uebertragbar -- auf dem Cluster neu bauen.
  - pytorch>=2.6

  # ---------- Notebooks / Entwicklung ----------
  - jupyterlab
  - ipykernel
  - ipywidgets
  - tqdm

  # ---------- Code-Qualitaet ----------
  - ruff
  - black
  - pytest

    # ---------- Bioinformatik ----------
  - biopython
  # mmseqs2 bewusst NICHT hier: die Conda-Variante zieht llvm-openmp
  # mit, das mit dem libomp aus den PyTorch-Wheels kollidiert
  # (OMP Error #15, Kernel-Crash beim import torch). mmseqs wird nur
  # per subprocess aufgerufen, nie importiert -- daher getrennt:
  #   macOS : brew install mmseqs2
  #   Linux : statische Binary von
  #           https://github.com/soedinglab/MMseqs2/releases
  # Pruefen: mmseqs version

  # ---------- pip-only ----------
  - pip
  - pip:
      


      # Protein-Sprachmodell: ESM-2 (esm2_t6_8M_UR50D)
      - fair-esm>=2.0.0

      # HF-Stack -- gebraucht fuer ProGen2-Perplexitaet in der Evaluation
      - transformers>=4.45
      - tokenizers
      - safetensors
      - huggingface_hub
      - accelerate

      # Diffusions-Bausteine
      - einops
      - ema-pytorch>=0.4.2

      # Experiment-Tracking
      - wandb


